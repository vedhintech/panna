name: Build Panna Android APK

on:
  push:
    branches: [main]
    paths:
      - 'Panna_Premium_Final.zip'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Extract source
        run: |
          mkdir -p source
          unzip -q Panna_Premium_Final.zip -d source
          PACKAGE_JSON="$(find source -name package.json -not -path '*/node_modules/*' -print -quit)"
          test -n "$PACKAGE_JSON" || { echo "package.json not found"; exit 1; }
          APP_DIR="$(dirname "$PACKAGE_JSON")"
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"
          echo "Source directory: $APP_DIR"
      - name: Install dependencies and build web app
        run: |
          cd "$APP_DIR"
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run build
      - name: Sync Capacitor Android
        run: cd "$APP_DIR" && npx cap sync android
      - name: Build debug APK
        run: |
          cd "$APP_DIR/android"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Panna-Android-APK
          path: ${{ env.APP_DIR }}/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
